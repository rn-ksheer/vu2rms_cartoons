<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HamToons by VU2RMS</title>

<style>

#imgCounter{
  position:fixed;
  top:12px;
  left:12px;
  display:flex;
  align-items:center;
  gap:6px;

  background:rgba(0,0,0,0.65);
  backdrop-filter:blur(6px);
  padding:7px 14px;
  border-radius:8px;
  font-size:14px;
  border:1px solid rgba(255,255,255,0.25);
  color:#fff;
  letter-spacing:0.5px;
  z-index:1000;
}
#imgCounter span{
  display:flex;
  align-items:center;
}

#imgCounter .icon{
  font-size:16px;
  transform:translateY(-1px);
}

body{
  margin:0;
  background:#000;
  color:white;
  font-family:Arial;
  text-align:center;
}

h1{margin:15px 0;}

#viewer{
  display:inline-block;
  width:100%;
  text-align:center;
   touch-action: pan-y;
}

#viewer img{
  max-width:95vw;
  max-height:60vh;
  display:block;
  margin:auto;
  border:4px solid white;
  border-radius:10px;
  transition:transform 0.6s ease, opacity 0.6s ease;
}

.controls{
  margin:12px;
  display:flex;
  justify-content:center;
  gap:10px;
  flex-wrap:wrap;
}

button{
  padding:10px 16px;
  border:none;
  border-radius:6px;
  background:#333;
  color:white;
  cursor:pointer;
}

button:hover{background:#555;}

.thumbs{
  display:flex;
  overflow-x:auto;
  gap:8px;
  justify-content:flex-start;
  padding:8px;
  scroll-behavior:smooth;
}

.thumbs img{
  height:70px;
  min-width:110px;
  object-fit:cover;
  border:2px solid #666;
  border-radius:6px;
  cursor:pointer;
  opacity:.6;
  transition:transform 0.3s ease;
}

.thumbs img.active{
  border-color:#ffcc00;
  opacity:1;
  transform:scale(1.08);
}

/* Zoom animation */
.zoom{
  animation:zoomFade 0.6s ease;
}

@keyframes zoomFade{
  from{
    opacity:0;
    transform:scale(1.08);
  }
  to{
    opacity:1;
    transform:scale(1);
  }
}

/* Mobile layout */
@media (max-width:600px){
  h1{font-size:20px;}
  #viewer img{max-height:55vh;}

  .thumbs{
    display:grid;
    grid-template-columns:repeat(auto-fit, minmax(90px,1fr));
    grid-auto-rows:70px;
    gap:6px;
    padding:8px;
    overflow:visible;
  }

  .thumbs img{
    height:70px;
    min-width:auto;
    width:100%;
  }
}
</style>
</head>

<body>

<div id="imgCounter"></div>
<h1>HamToons by VU2RMS</h1>

<div id="viewer">
  <img id="mainImg" src="./images/img54.jpg">
</div>

<div class="controls">
<button onclick="prev()">◀ Prev</button>
<button onclick="togglePlay()" id="playBtn">▶ Play</button>
<button onclick="next()">Next ▶</button>
<button onclick="toggleFullscreen()" id="fsBtn">⛶ Full screen</button>
</div>

<div class="thumbs" id="thumbs"></div>

<script>
const total = 153;
let i = total;   // start from last image
let timer = null;

const main = document.getElementById('mainImg');
const thumbs = document.getElementById('thumbs');
const counter = document.getElementById('imgCounter');

// Create thumbnails in reverse order
for(let k = total; k >= 1; k--){
  const t = document.createElement('img');
  t.src = `./images/img${String(k).padStart(2,'0')}.jpg`;
  t.onclick = () => show(k);
  thumbs.appendChild(t);
}

function show(n){
  i = n;

  main.classList.remove("zoom");
  void main.offsetWidth;
  main.classList.add("zoom");

  main.src = `./images/img${String(i).padStart(2,'0')}.jpg`;

  counter.innerHTML = `
<svg width="18" height="18" viewBox="0 0 24 24" fill="white" style="vertical-align:middle;margin-right:6px;">
<path d="M9 3L7.17 5H4a2 2 0 0 0-2 2v11a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V7a2 2 0 0 0-2-2h-3.17L15 3H9zm3 15a5 5 0 1 1 0-10 5 5 0 0 1 0 10zm0-2.5A2.5 2.5 0 1 0 12 10a2.5 2.5 0 0 0 0 5z"/>
</svg>
${i} / ${total}
`;

  Array.from(thumbs.children).forEach((c) => {
    const thumbNum = parseInt(c.src.match(/img(\d+)\.jpg$/)[1]);
    c.classList.toggle('active', thumbNum === i);
  });

  centerActiveThumbnail();
}

// Reverse slideshow direction (54 → 53 → 52…)
function next(){
  show((i - 2 + total) % total + 1);
}

function prev(){
  show(i % total + 1);
}

function togglePlay(){
  if(timer){
    clearInterval(timer);
    timer = null;
    document.getElementById('playBtn').textContent='▶ Play';
  } else {
    timer = setInterval(next,3000);
    document.getElementById('playBtn').textContent='⏸ Pause';
  }
}

function toggleFullscreen(){
  const el = document.documentElement;
  if(!document.fullscreenElement){
    el.requestFullscreen().catch(()=>{});
    document.getElementById('fsBtn').textContent='⤢ Exit full screen';
  } else {
    document.exitFullscreen().catch(()=>{});
    document.getElementById('fsBtn').textContent='⛶ Full screen';
  }
}

function centerActiveThumbnail(){
  const active = thumbs.querySelector(".active");
  if(!active) return;

  if(thumbs.scrollWidth <= thumbs.clientWidth) return;

  const scrollTo =
    active.offsetLeft - (thumbs.clientWidth / 2) + (active.clientWidth / 2);

  thumbs.scrollTo({
    left: scrollTo,
    behavior: "smooth"
  });
}

// Load last image first
show(total);

/* =========================
   Mobile Swipe Support
   ========================= */

let touchStartX = 0;
let touchEndX = 0;

const viewer = document.getElementById("viewer");

function handleGesture() {
  const swipeThreshold = 50; // minimum px distance

  if (touchEndX < touchStartX - swipeThreshold) {
    // Swipe left → Next image
    next();
  }

  if (touchEndX > touchStartX + swipeThreshold) {
    // Swipe right → Previous image
    prev();
  }
}

// Enable only on touch devices (mobile)
if ("ontouchstart" in window) {

  viewer.addEventListener("touchstart", (e) => {
    touchStartX = e.changedTouches[0].screenX;
  });

  viewer.addEventListener("touchend", (e) => {
    touchEndX = e.changedTouches[0].screenX;
    handleGesture();
  });

}

</script>

</body>
</html>
